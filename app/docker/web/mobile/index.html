<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>骏耀K歌 · 点歌 & 遥控</title>
<style>
:root{
  --bg:#08081c;--card:rgba(255,255,255,0.06);
  --accent:#c736f7;--accent2:#36d9f7;--pink:#ff4f9b;--orange:#ff8c42;
  --text:#f4f4ff;--sub:#8888aa;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;
  background:radial-gradient(circle at 15% 0%,rgba(199,54,247,.18),transparent 45%),
             radial-gradient(circle at 85% 30%,rgba(54,169,247,.15),transparent 45%),var(--bg);
  color:var(--text);font-family:"PingFang SC","Microsoft YaHei",sans-serif;
  padding-bottom:80px}

/* ===== HEADER ===== */
header{
  position:sticky;top:0;z-index:10;
  background:rgba(8,8,28,.9);backdrop-filter:blur(16px);
  border-bottom:1px solid rgba(255,255,255,.07);padding:14px 16px 0}
.brand{font-size:20px;font-weight:900;letter-spacing:1px;
  background:linear-gradient(90deg,var(--accent2),var(--accent));
  -webkit-background-clip:text;background-clip:text;color:transparent}
/* Tab bar */
.tabs{display:flex;margin-top:12px;gap:4px}
.tab{
  flex:1;text-align:center;padding:10px 0;font-size:13px;
  color:var(--sub);border-bottom:2px solid transparent;transition:.2s
}
.tab.active{color:#fff;border-bottom-color:var(--accent)}

/* ===== SEARCH TAB ===== */
#tab-search .search-box{
  margin:14px 16px 0;display:flex;align-items:center;gap:8px;
  background:rgba(255,255,255,.07);border-radius:14px;padding:11px 14px;
  border:1px solid rgba(255,255,255,.08)}
#tab-search .search-box input{flex:1;background:transparent;border:none;outline:none;color:var(--text);font-size:15px}
#tab-search .nickname-row{margin:10px 16px 0}
#tab-search .nickname-row input{
  width:100%;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);
  border-radius:12px;padding:9px 14px;color:var(--text);font-size:13px;outline:none}
#song-list{padding:12px 16px;display:flex;flex-direction:column;gap:10px}
.song-card{
  display:flex;align-items:center;background:var(--card);
  border:1px solid rgba(255,255,255,.06);padding:13px 14px;border-radius:16px;gap:12px}
.song-card .info{flex:1}
.song-card .title{font-size:15px;font-weight:600}
.song-card .artist{font-size:12px;color:var(--sub);margin-top:3px}
.btn-add{
  width:38px;height:38px;border-radius:50%;border:none;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  color:#fff;font-size:18px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.btn-fav{
  width:34px;height:34px;border-radius:50%;border:1px solid rgba(255,255,255,.15);
  background:rgba(255,255,255,.06);font-size:16px;display:flex;align-items:center;
  justify-content:center;flex-shrink:0;color:var(--sub)}
.btn-fav.faved{background:rgba(255,79,155,.25);border-color:var(--pink);color:var(--pink)}
#empty{text-align:center;color:#555;padding:40px 0;font-size:14px}

/* ===== QUEUE TAB ===== */
#tab-queue{padding:14px 16px}
.q-row{
  display:flex;align-items:center;padding:13px 14px;border-radius:14px;
  background:var(--card);margin-bottom:10px;gap:10px;border:1px solid rgba(255,255,255,.05)}
.q-row.playing{border-color:var(--accent);background:rgba(199,54,247,.12)}
.q-num{font-size:12px;color:var(--sub);width:22px;text-align:center}
.q-info{flex:1}
.q-title{font-size:14px;font-weight:600}
.q-meta{font-size:11px;color:var(--sub);margin-top:3px}
.q-acts{display:flex;gap:6px}
.q-act{
  padding:5px 10px;border-radius:8px;font-size:11px;border:none;
  background:rgba(255,255,255,.08);color:#fff}
.q-act.top{background:rgba(124,44,247,.5)}
.q-act.del{background:rgba(255,79,155,.2);color:var(--pink)}

/* ===== REMOTE TAB ===== */
#tab-remote{padding:20px 16px;display:flex;flex-direction:column;gap:16px}

/* Now playing bar */
#now-bar{
  background:rgba(199,54,247,.12);border:1px solid rgba(199,54,247,.3);
  border-radius:16px;padding:14px 16px;display:flex;align-items:center;gap:12px}
#now-bar .nb-info{flex:1}
#now-bar .nb-title{font-size:14px;font-weight:700}
#now-bar .nb-meta{font-size:11px;color:var(--sub);margin-top:2px}
#now-bar .nb-status{font-size:11px;color:var(--accent)}

/* Playback control row */
.ctrl-section{background:rgba(255,255,255,.04);border-radius:18px;padding:16px}
.ctrl-title{font-size:12px;color:var(--sub);letter-spacing:1px;margin-bottom:14px}
.ctrl-row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.ctrl-btn{
  flex:1;min-width:70px;max-width:90px;
  display:flex;flex-direction:column;align-items:center;gap:5px;
  padding:12px 8px;border-radius:14px;cursor:pointer;
  background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);
  transition:.15s;user-select:none}
.ctrl-btn:active{transform:scale(.93);background:rgba(199,54,247,.25);border-color:var(--accent)}
.ctrl-btn .ci{font-size:22px}
.ctrl-btn .cl{font-size:11px;color:var(--sub)}
.ctrl-btn.red .cl{color:var(--pink)}
.ctrl-btn.red:active{background:rgba(255,79,155,.25);border-color:var(--pink)}
.ctrl-btn.cyan .cl{color:var(--accent2)}
.ctrl-btn.cyan:active{background:rgba(54,217,247,.2);border-color:var(--accent2)}
.ctrl-btn.purple{background:rgba(199,54,247,.15);border-color:rgba(199,54,247,.35)}
.ctrl-btn.purple .cl{color:var(--accent)}

/* D-pad */
.dpad{
  display:grid;grid-template-columns:1fr 1fr 1fr;
  grid-template-rows:1fr 1fr 1fr;gap:8px;max-width:220px;margin:0 auto}
.dpad-btn{
  display:flex;align-items:center;justify-content:center;
  height:64px;border-radius:14px;font-size:22px;
  background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);
  cursor:pointer;transition:.15s}
.dpad-btn:active{transform:scale(.9);background:rgba(54,217,247,.2);border-color:var(--accent2)}
.dpad-ok{
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  font-size:15px;font-weight:700;border:none}
.dpad-empty{background:transparent;border:none;pointer-events:none}

/* ===== FAB queue ===== */
#queue-fab{
  position:fixed;right:16px;bottom:16px;z-index:20;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  color:#000;font-weight:700;padding:13px 18px;border-radius:999px;
  font-size:13px;display:flex;align-items:center;gap:8px;
  box-shadow:0 8px 24px rgba(199,54,247,.4)
}
.fab-badge{background:rgba(0,0,0,.3);border-radius:999px;padding:1px 7px;font-size:12px}

/* ===== TOAST ===== */
#toast{
  position:fixed;left:50%;top:16px;transform:translateX(-50%) translateY(-70px);
  background:#fff;color:#111;padding:9px 18px;border-radius:12px;
  font-size:13px;z-index:50;transition:.25s;box-shadow:0 10px 30px rgba(0,0,0,.25)
}
#toast.show{transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<header>
  <div class="brand">骏耀K歌</div>
  <div class="tabs">
    <div class="tab active" onclick="switchTab('search',this)">🎵 点歌</div>
    <div class="tab" onclick="switchTab('queue',this)">📋 队列</div>
    <div class="tab" onclick="switchTab('remote',this)">🎮 遥控</div>
  </div>
</header>

<!-- ====== SEARCH TAB ====== -->
<div id="tab-search">
  <div class="search-box">
    <span>🔍</span>
    <input id="search-input" placeholder="搜索歌名 / 歌手">
  </div>
  <div class="nickname-row">
    <input id="nickname-input" placeholder="点歌昵称（可选）">
  </div>
  <div id="song-list"></div>
  <button id="search-more" style="display:none;width:100%;padding:12px;margin:10px 0;border:none;border-radius:10px;background:#ff2255;color:#fff;font-size:15px" onclick="loadMoreSongs()">加载更多 ↓</button>
  <div id="empty" style="display:none">没有找到相关歌曲</div>
</div>

<!-- ====== QUEUE TAB ====== -->
<div id="tab-queue" style="display:none"></div>

<!-- ====== REMOTE TAB ====== -->
<div id="tab-remote" style="display:none">

  <!-- Now playing -->
  <div id="now-bar">
    <span style="font-size:26px">🎤</span>
    <div class="nb-info">
      <div class="nb-title" id="nb-title">暂无播放</div>
      <div class="nb-meta" id="nb-meta">—</div>
    </div>
    <span class="nb-status" id="nb-status"></span>
  </div>

  <!-- Playback controls -->
  <div class="ctrl-section">
    <div class="ctrl-title">▶ 播放控制</div>
    <div class="ctrl-row">
      <div class="ctrl-btn purple" onclick="sendCtrl('play_pause')">
        <span class="ci" id="r-play-icon">⏸</span><span class="cl" id="r-play-label">暂停</span>
      </div>
      <div class="ctrl-btn cyan" onclick="sendCtrl('voice')">
        <span class="ci">🎤</span><span class="cl" id="r-voice-label">原/伴唱</span>
      </div>
      <div class="ctrl-btn" onclick="sendCtrl('repeat')">
        <span class="ci">🔄</span><span class="cl">重唱</span>
      </div>
      <div class="ctrl-btn red" onclick="sendCtrl('next')">
        <span class="ci">⏭</span><span class="cl">切歌</span>
      </div>
    </div>
  </div>

  <!-- View controls -->
  <div class="ctrl-section">
    <div class="ctrl-title">📺 TV界面</div>
    <div class="ctrl-row">
      <div class="ctrl-btn" onclick="sendCtrl('home')">
        <span class="ci">🏠</span><span class="cl">主页</span>
      </div>
      <div class="ctrl-btn cyan" onclick="sendCtrl('fullscreen')">
        <span class="ci">⛶</span><span class="cl">全屏</span>
      </div>
      <div class="ctrl-btn" onclick="sendCtrl('back')">
        <span class="ci">←</span><span class="cl">返回</span>
      </div>
    </div>
  </div>

  <!-- D-pad -->
  <div class="ctrl-section">
    <div class="ctrl-title">🕹 方向导航</div>
    <div class="dpad">
      <div class="dpad-btn dpad-empty"></div>
      <div class="dpad-btn" onclick="sendCtrl('focus_up')">▲</div>
      <div class="dpad-btn dpad-empty"></div>
      <div class="dpad-btn" onclick="sendCtrl('focus_left')">◀</div>
      <div class="dpad-btn dpad-ok" onclick="sendCtrl('ok')">确认</div>
      <div class="dpad-btn" onclick="sendCtrl('focus_right')">▶</div>
      <div class="dpad-btn dpad-empty"></div>
      <div class="dpad-btn" onclick="sendCtrl('focus_down')">▼</div>
      <div class="dpad-btn dpad-empty"></div>
    </div>
  </div>

</div>

<div id="queue-fab" onclick="switchTabByName('queue')">
  🎵 当前队列 <span class="fab-badge" id="fab-badge">0</span>
</div>
<div id="toast"></div>

<script>
const searchInput = document.getElementById('search-input');
const nicknameInput = document.getElementById('nickname-input');
nicknameInput.value = localStorage.getItem('ktv_nick') || '';
nicknameInput.addEventListener('change', ()=>localStorage.setItem('ktv_nick', nicknameInput.value));

// ===== Tabs =====
function switchTab(name, el){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  if(el) el.classList.add('active');
  document.getElementById('tab-search').style.display = name==='search' ? 'block' : 'none';
  document.getElementById('tab-queue').style.display = name==='queue' ? 'block' : 'none';
  document.getElementById('tab-remote').style.display = name==='remote' ? 'block' : 'none';
  if(name==='queue') renderQueue();
}
function switchTabByName(name){
  const tabs=document.querySelectorAll('.tab');
  const idx={'search':0,'queue':1,'remote':2}[name]||0;
  switchTab(name, tabs[idx]);
}

// ===== WS =====
let queueData=[];
let isPlaying=false, localPaused=false, localVoice=true;

function connectWS(){
  const ws=new WebSocket(`${location.protocol==='https:'?'wss':'ws'}://${location.host}/ws`);
  ws.onmessage=ev=>{
    const msg=JSON.parse(ev.data);
    if(msg.type==='queue'){queueData=msg.data;onQueue();}
  };
  ws.onclose=()=>setTimeout(connectWS,2000);
  window._ws=ws;
}
connectWS();

function sendCtrl(action){ sendWS({type:'control',action}); }
function sendWS(obj){ if(window._ws&&window._ws.readyState===1) window._ws.send(JSON.stringify(obj)); }

function onQueue(){
  const playing=queueData.find(q=>q.status==='playing');
  document.getElementById('fab-badge').textContent=queueData.length;
  if(playing){
    document.getElementById('nb-title').textContent=playing.title;
    document.getElementById('nb-meta').textContent=`${playing.artist} · ${playing.nickname}`;
    document.getElementById('nb-status').textContent='♪ 播放中';
  } else {
    document.getElementById('nb-title').textContent='暂无播放';
    document.getElementById('nb-meta').textContent='—';
    document.getElementById('nb-status').textContent='';
  }
  if(document.getElementById('tab-queue').style.display!=='none') renderQueue();
}

function renderQueue(){
  const el=document.getElementById('tab-queue');
  el.innerHTML='';
  if(!queueData.length){el.innerHTML='<div style="color:#555;text-align:center;padding:40px">队列空空如也</div>';return;}
  queueData.forEach((q,i)=>{
    const row=document.createElement('div');
    row.className='q-row'+(q.status==='playing'?' playing':'');
    row.innerHTML=`
      <div class="q-num">${q.status==='playing'?'♪':i+1}</div>
      <div class="q-info"><div class="q-title">${q.title}</div><div class="q-meta">${q.artist} · ${q.nickname}</div></div>
      <div class="q-acts">
        ${q.status!=='playing'?`<button class="q-act top" onclick="topSong(${q.queue_id})">置顶</button>`:''}
        <button class="q-act del" onclick="delSong(${q.queue_id})">✕</button>
      </div>`;
    el.appendChild(row);
  });
}

async function topSong(id){ await fetch(`/api/queue/${id}/top`,{method:'POST'}); }
async function delSong(id){ await fetch(`/api/queue/${id}`,{method:'DELETE'}); }

// ===== Song search & add =====
// 40,000+ 曲库修复：搜索原本硬限 60 首、无法翻看更多。改为"首屏 60 + 加载更多"，
// 每批只取一小页，列表再长也不会一次性渲染全部 DOM。
let searchTimer, searchRequest = 0, searchQ='', searchOffset=0; const SEARCH_PG=60;
searchInput.addEventListener('input',()=>{
  clearTimeout(searchTimer);
  searchTimer=setTimeout(()=>loadSongs(searchInput.value.trim()),320);
});
async function loadSongs(q=''){
  const requestId=++searchRequest;
  searchQ=q; searchOffset=0;
  const params=new URLSearchParams({limit:String(SEARCH_PG)});
  if(q)params.set('q',q);
  const res=await fetch(`/api/songs?${params}`);
  const songs=await res.json();
  if(requestId===searchRequest){
    renderSongs(songs,true);
    const more=document.getElementById('search-more');
    if(more)more.style.display = songs.length===SEARCH_PG ? 'block':'none';
  }
}
async function loadMoreSongs(){
  const requestId=++searchRequest; // 作废进行中的输入查询
  searchOffset+=SEARCH_PG;
  const params=new URLSearchParams({limit:String(SEARCH_PG),offset:String(searchOffset)});
  if(searchQ)params.set('q',searchQ);
  const res=await fetch(`/api/songs?${params}`);
  const songs=await res.json();
  if(requestId!==searchRequest)return;
  renderSongs(songs,false);
  const more=document.getElementById('search-more');
  if(more)more.style.display = songs.length===SEARCH_PG ? 'block':'none';
}
function renderSongs(list, replace=true){
  const el=document.getElementById('song-list');
  document.getElementById('empty').style.display=list.length?'none':'block';
  if(replace)el.innerHTML='';
  list.forEach(s=>{
    const c=document.createElement('div');
    c.className='song-card';
    const favKey='fav_'+s.id;
    const isFaved=localStorage.getItem(favKey)==='1';
    c.innerHTML=`
      <div class="info"><div class="title">${s.title}</div><div class="artist">${s.artist||''}</div></div>
      <div style="display:flex;gap:6px;align-items:center">
        <button class="btn-fav${isFaved?' faved':''}">❤</button>
        <button class="btn-add">＋</button>
      </div>`;
    c.querySelector('.btn-add').onclick=()=>addSong(s.id, s.title);
    c.querySelector('.btn-fav').onclick=()=>toggleFav(s.id, c.querySelector('.btn-fav'));
    el.appendChild(c);
  });
}
async function addSong(id, title){
  const nick=nicknameInput.value.trim()||'匿名歌手';
  await fetch('/api/queue',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({song_id:id,nickname:nick})});
  showToast(`《${title}》已加入队列 🎶`);
}

function getDevId(){
  let id=localStorage.getItem('ktvdev');
  if(!id){id='m-'+Math.random().toString(36).substr(2,9);localStorage.setItem('ktvdev',id);}
  return id;
}
async function toggleFav(id,btn){
  const key='fav_'+id;
  const faved=localStorage.getItem(key)==='1';
  if(faved){
    await fetch(`/api/favorites/${id}?device=${getDevId()}`,{method:'DELETE'});
    localStorage.removeItem(key);btn.classList.remove('faved');showToast('已取消收藏');
  } else {
    await fetch(`/api/favorites/${id}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({device:getDevId()})});
    localStorage.setItem(key,'1');btn.classList.add('faved');showToast('已收藏 ❤');
  }
}
function showToast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1600);
}

loadSongs();
fetch('/api/queue').then(r=>r.json()).then(d=>{queueData=d;onQueue();});
</script>
</body>
</html>
