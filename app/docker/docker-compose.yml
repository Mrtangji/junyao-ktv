version: "3.8"
services:
  junyao-ktv:
    build: .
    image: junyao-ktv:1.0.8
    container_name: junyao-ktv
    restart: unless-stopped
    # 端口已取消自定义功能，固定使用宿主机 8080（HTTP）/ 8443（HTTPS 自签，
    # 麦克风评分等需要安全上下文的功能走这个口），不再需要生命周期脚本改写。
    ports:
      - "8080:8080"
      - "8443:8443"
    environment:
      - TZ=Asia/Shanghai
      - PORT=8080
      - HTTPS_PORT=8443
      - DATA_DIR=/data
      - MV_DIR=/mv
      # MP3（含 LRC 歌词）与 MV 分开存放：点唱榜下载的 mp3 → /mp3，mv → /mv。
      # 不需要分库时删除这行，MP3 会回落到 MV_DIR。
      - MP3_DIR=/mp3
      # VAAPI 渲染节点路径，容器内代码据此判断硬件加速是否可用；与下面
      # devices 段落是否被安装脚本裁掉保持一致（宿主机没有核显/独显时，
      # cmd/install_init、cmd/upgrade_init 会自动删掉 devices 段落，容器里
      # 检测不到这个路径就会自动回退到 libx264 软件编码）。
      - VAAPI_DEVICE=/dev/dri/renderD128
      # HLS 缓存每日清理：距上次转码完成超过这个天数、且最近未被重新点唱的
      # 缓存会被自动清理释放磁盘空间，源 MV 文件不受影响，下次点唱会自动
      # 重新生成缓存。
      - HLS_CACHE_MAX_AGE_DAYS=3
      # 启动是否自动全量扫描曲库：默认关闭（不设即为关闭）。
      # 全量扫描要递归遍历 /mv + /mp3 并对每个文件起一次 ffprobe，大曲库会跑
      # 很久、期间持续吃 CPU，正是"容器刚起来什么都没做 CPU 就上去了"的来源。
      # 曲库已有的歌本就在 songs 表（镜像还内置 muse.db）里，不扫描也照常显示
      # 和点唱；下载入库走的是单文件 scanFile，与此无关。
      # 手工往 mv/、mp3/ 里丢过新文件需要入库时，在电视端/管理页点「扫描曲库」
      # 手动扫一次即可。想让开机自动扫描就把它改成 1。
      - SCAN_ON_START=0
      # 曲库扫描的探测并发数（1-16，默认 4）：扫描给每个新文件起一次 ffprobe，
      # NAS 网络盘上单个探测大半时间在等 IO，调大并发能成倍提升吞吐。
      # 飞牛/群晖这类 4 核 NAS 建议 8；CPU 特别弱或扫描时卡顿明显就调回 4。
      # 注意：只在探测"新增/变化"的文件时生效，未变化文件直接跳过、不受影响。
      - SCAN_CONCURRENCY=8
      # 无人在线时自动停止后台播放/转码的宽限期（毫秒）；见 README/提交说明。
      # - IDLE_STOP_MS=60000
      # 只停转码、保留队列"正在播放"状态（希望电视重开后接着刚才那首时设 1）。
      # - IDLE_STOP_KEEP_PLAYING=1
      # 版本信息：CI 构建时已把 commit sha / 构建时间烘进镜像，查当前部署版本：
      #   curl http://NAS:8080/api/version      （管理后台头部也有徽标）
      # 想让版本号显示成自定义值（例如本地构建），取消下面这行注释即可。
      # - APP_VERSION=dev
    volumes:
      # 应用数据和 MV 曲库已取消自定义路径功能，统一固定使用应用默认共享
      # 目录 /vol1/@appshare/junyao-ktv 下的 data、mv 两个子目录，不再支持
      # 通过安装/配置向导修改，因此这里直接写死绝对路径，不需要生命周期
      # 脚本再用 sed 改写。
      - /vol1/@appshare/junyao-ktv/data:/data    # 数据库/封面持久化
      - /vol1/@appshare/junyao-ktv/mv:/mv        # MV 曲库文件
      - /vol1/@appshare/junyao-ktv/mp3:/mp3      # MP3+LRC 曲库文件（与 MV_DIR 分库时用）
    # VAAPI_DEVICES_BEGIN
    # 直通宿主机的 DRI 渲染节点，供 ffmpeg 使用 h264_vaapi 做硬件编解码。
    # 注意：如果宿主机没有 /dev/dri（纯软件环境/无核显的老机器），
    # `docker compose up` 会因为设备不存在而直接报错退出，因此这整段
    # (含 devices: 键) 是否保留在最终生效的 docker-compose.yml 里，由
    # cmd/install_init 和 cmd/upgrade_init 在真实宿主机上安装/升级时
    # 动态探测决定：探测不到 /dev/dri/renderD128 就会把这段一起删掉，
    # 保证没有硬件加速的机器上应用依然能正常启动（仅走软件转码）。
    devices:
      - /dev/dri:/dev/dri
    # VAAPI_DEVICES_END
